name: Citation Benchmark

on:
  push:
    paths:
      - "server/src/engine/**"
      - "server/src/pipeline/**"
      - "server/src/benchmark/**"
      - "server/src/training/truthFields.ts"
      - "server/scripts/benchmark/**"
      - "benchmarks/grobid-pmc/**"
      - "package.json"
      - "server/package.json"
      - ".github/workflows/citation-benchmark.yml"
  pull_request:
    paths:
      - "server/src/engine/**"
      - "server/src/pipeline/**"
      - "server/src/benchmark/**"
      - "server/src/training/truthFields.ts"
      - "server/scripts/benchmark/**"
      - "benchmarks/grobid-pmc/**"
      - "package.json"
      - "server/package.json"
      - ".github/workflows/citation-benchmark.yml"

jobs:
  grobid-style-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Run pilot benchmark
        run: pnpm --dir server run benchmark:run -- --mode=pilot --profile=heuristic-only

      - name: Evaluate pilot benchmark
        run: pnpm --dir server run benchmark:evaluate -- --mode=pilot

      - name: Enforce pilot benchmark gate
        run: pnpm --dir server run benchmark:gate -- --mode=pilot

      - name: Append benchmark summary
        if: always()
        run: |
          {
            echo "## Citation Benchmark"
            echo
            cat benchmarks/grobid-pmc/results/pilot.summary.md
            echo
            echo "## Citation Benchmark Debug"
            echo
            cat benchmarks/grobid-pmc/results/pilot.debug.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-benchmark-pilot
          path: |
            benchmarks/grobid-pmc/results/pilot.latest.json
            benchmarks/grobid-pmc/results/pilot.summary.md
            benchmarks/grobid-pmc/results/pilot.debug.json
            benchmarks/grobid-pmc/results/pilot.debug.md
